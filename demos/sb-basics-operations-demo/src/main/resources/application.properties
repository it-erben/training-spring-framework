# Der Anwendungsname taucht u.a. in Metriken und (später, im
# Advanced-Teil) in Traces auf.
spring.application.name=bookstore

# Standardmäßig ist nur /actuator/health über HTTP erreichbar —
# alles Weitere wird bewusst freigeschaltet. In Produktion gilt:
# so wenig wie möglich exponieren oder den Management-Port absichern.
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Health zeigt die Details der einzelnen Indikatoren (z.B. diskSpace)
# statt nur des aggregierten Status.
management.endpoint.health.show-details=always

# Statische Metadaten für /actuator/info. Der env-Contributor, der
# info.*-Properties dorthin durchreicht, ist seit Spring Boot 2.6
# abgeschaltet und muss explizit aktiviert werden.
management.info.env.enabled=true
info.app.name=Buchhandlung Erben

# Ausgangspunkt der Demo-Pointe: tech.erben loggt auf INFO, die
# debug-Zeilen aus OrderService bleiben unsichtbar — bis das Level per
# POST /actuator/loggers/tech.erben zur Laufzeit umgestellt wird.
logging.level.tech.erben=INFO
