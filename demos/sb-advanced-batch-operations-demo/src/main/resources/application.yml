spring:
  datasource:
    # Dateibasiert: Das JobRepository muss den simulierten Absturz überleben,
    # sonst gäbe es nach dem Neustart nichts aufzuräumen.
    url: jdbc:h2:file:./target/operations
  sql:
    init:
      mode: always
  batch:
    jdbc:
      initialize-schema: always
    job:
      # Anders als in Modul 18: Der Job läuft nicht beim Hochfahren, sondern
      # wenn ihn jemand über HTTP auslöst.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

ops:
  writer: insert
  halt-after-chunk: 0
  lock: false
  input: orders.csv
  input-b: orders-b.csv
  parallel: false
  item-delay: 400ms
