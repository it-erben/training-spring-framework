# In-Memory-H2: Die Datenbank lebt nur so lange wie die JVM.
spring.datasource.url=jdbc:h2:mem:bookstore
# Hibernate erzeugt das Schema beim Start aus den Entities und wirft es beim Stop weg.
# Nur für Demos und Tests! In Produktion gehört das Schema in versionierte
# Migrationen (Flyway/Liquibase, siehe Aufbaumodul 13_Data) und ddl-auto auf validate.
spring.jpa.hibernate.ddl-auto=create-drop
# Jedes SQL-Statement im Log — für die Demo wichtiger als für die Produktion.
spring.jpa.show-sql=true
# Wirkt erst, wenn ein Web-Starter auf dem Klassenpfad liegt (die H2-Konsole ist ein Servlet).
spring.h2.console.enabled=true
