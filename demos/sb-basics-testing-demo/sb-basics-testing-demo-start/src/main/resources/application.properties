# In-Memory-H2 wie in Modul 03: Die Datenbank lebt nur so lange wie die JVM —
# im Integrationstest fährt sie mit dem Kontext hoch und wieder runter.
spring.datasource.url=jdbc:h2:mem:bookstore
# Hibernate erzeugt das Schema beim Start aus den Entities. Nur für Demos
# und Tests geeignet (siehe Modul 03).
spring.jpa.hibernate.ddl-auto=create-drop
