include:
  - project: "it-erben/utilities/slides-pdf-pages"
    ref: main
    file: "/ci/pdf-pages.yml"

variables:
  PDF_BUILD_IMAGE: "node:20"
  PDF_BUILD_DIR: "slides"
  PDF_BUILD_SCRIPT: "npm ci && npm run build"
  PDF_OUTPUT_DIR: "pdf_slides"
  PDF_INDEX_TITLE: "Spring Boot Advanced Slides"
  PDF_INDEX_DESCRIPTION: "Rendered PDF handouts for the course"
