# In-Memory-H2: Die Datenbank lebt nur so lange wie die JVM.
spring.datasource.url=jdbc:h2:mem:courseadmin
# Hibernate erzeugt das Schema beim Start aus den Entities und wirft es beim Stop weg.
# Nur für Übungen und Tests — in Produktion gehört das Schema in versionierte Migrationen.
spring.jpa.hibernate.ddl-auto=create-drop
# Jedes SQL-Statement im Log — so seht ihr, was aus euren Methodennamen wird.
spring.jpa.show-sql=true
