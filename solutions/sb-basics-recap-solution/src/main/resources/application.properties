# In-Memory-H2 wie in Modul 03: Die Datenbank lebt nur so lange wie die JVM.
spring.datasource.url=jdbc:h2:mem:roomadmin
# Hibernate erzeugt das Schema beim Start aus den Entities. Nur für Übungen
# und Tests geeignet (siehe Modul 03).
spring.jpa.hibernate.ddl-auto=create-drop

# Gebundener Wert für RoomProperties (Modul 01). Werte in .properties liest
# Spring als ISO-8859-1 — deshalb hier keine Umlaute.
roomadmin.default-building=Haus A

# Actuator aus Modul 05: Über HTTP ist ohne diese Zeile nur /actuator/health
# erreichbar.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
